<!doctype html>
<html lang="ru" data-product-format="interactive-diagnostic">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Докрути — диагностический маршрут</title>
  <style>
    :root { --chocolate:#17130F; --graphite:#262626; --paper:#F4F5F6; --trace:#D9562F; --blue:#2F80ED; --muted:#B8B0A6; }
    * { box-sizing:border-box; } body { margin:0; background:var(--chocolate); color:var(--paper); font:16px/1.5 system-ui,sans-serif; }
    main { max-width:760px; margin:auto; padding:48px 22px; } h1 { font:500 clamp(42px,8vw,72px)/.95 Georgia,serif; letter-spacing:-.05em; } p { color:var(--muted); }
    form, #result { margin-top:28px; padding:22px; border:1px solid rgba(244,245,246,.2); background:var(--graphite); } fieldset { border:0; padding:0; display:grid; gap:14px; }
    label { display:grid; gap:6px; color:var(--muted); } input { min-height:48px; padding:10px; font:inherit; } button { min-height:48px; border:0; background:var(--trace); color:var(--paper); padding:12px 18px; font-weight:700; cursor:pointer; } button:focus-visible { outline:3px solid var(--blue); outline-offset:3px; }
    #result[data-state="idle"], #result[data-state="loading"], #result[data-state="empty"], #result[data-state="error"] { display:block; } [hidden] { display:none !important; }
    .value { color:var(--paper); font-size:28px; } .next { border-left:3px solid var(--trace); padding-left:14px; }
  </style>
</head>
<body><main><p>ДОКРУТИ / bounded product golden</p><h1>Что мешает результату?</h1><p>Введите показатели магазина и получите вычисленный сигнал, объяснение и следующий шаг.</p>
  <form id="diagnostic-form"><fieldset><label>Выручка, ₽ <input name="revenue_rub" type="number" min="1" required></label><label>Уникальные посетители <input name="visitors" type="number" min="1" required></label><label>Завершённые покупки <input name="purchases" type="number" min="0" required></label><label>Возвращённые покупки <input name="returns" type="number" min="0" required></label><button type="submit">Проверить сигнал</button></fieldset></form>
  <section id="result" data-state="idle" aria-live="polite"><strong id="state-label">Ожидаю данные</strong><p id="result-copy">После отправки появится расчёт.</p><p class="value" id="conversion" hidden></p><p id="return-rate" hidden></p><p class="next" id="next-action" hidden></p></section>
  <script>
    const form = document.querySelector('#diagnostic-form'); const result = document.querySelector('#result'); const state = document.querySelector('#state-label'); const copy = document.querySelector('#result-copy'); const conversion = document.querySelector('#conversion'); const returnRate = document.querySelector('#return-rate'); const next = document.querySelector('#next-action');
    form.addEventListener('submit', (event) => { event.preventDefault(); result.dataset.state = 'loading'; state.textContent = 'Считаю сигнал'; conversion.hidden = true; returnRate.hidden = true; next.hidden = true; const data = new FormData(form); const revenueRub = Number(data.get('revenue_rub')); const visitors = Number(data.get('visitors')); const purchases = Number(data.get('purchases')); const returns = Number(data.get('returns')); if (!Number.isFinite(revenueRub) || !Number.isFinite(visitors) || !Number.isFinite(purchases) || !Number.isFinite(returns) || revenueRub <= 0 || visitors <= 0 || purchases < 0 || returns < 0 || purchases > visitors || returns > purchases) { result.dataset.state = 'error'; state.textContent = 'Нужны корректные данные'; copy.textContent = 'Проверьте числа: покупки не могут быть больше посетителей, возвраты — больше покупок.'; return; } const revenuePerVisitor = revenueRub / visitors; const rate = purchases / visitors * 100; if (revenuePerVisitor > 1000000) { result.dataset.state = 'needs-review'; state.textContent = 'Нужна проверка источника'; copy.textContent = 'Средняя выручка на посетителя выглядит как выброс. Сверьте единицы и источник до принятия решения.'; next.textContent = 'Следующий шаг: проверить выгрузку выручки и период расчёта.'; next.hidden = false; return; } const rateText = rate.toFixed(2); conversion.textContent = `Конверсия: ${rateText}%`; conversion.hidden = false; if (purchases === 0) { result.dataset.state = 'edge'; state.textContent = 'Недостаточно покупок'; copy.textContent = `Средняя выручка на посетителя: ${revenuePerVisitor.toFixed(2)} ₽/посетителя. Доля возвратов не рассчитывается без покупок.`; next.textContent = 'Следующий шаг: проверить путь от посещения до первой покупки.'; next.hidden = false; return; } const returnRateText = (returns / purchases * 100).toFixed(1); returnRate.textContent = `Возвраты: ${returnRateText}% от покупок`; returnRate.hidden = false; result.dataset.state = 'ready'; state.textContent = 'Сигнал найден'; copy.textContent = `Средняя выручка на посетителя: ${revenuePerVisitor.toFixed(2)} ₽/посетителя. Конверсия: ${rateText}%.`; next.textContent = Number(returnRateText) > 10 ? 'Следующий шаг: разобрать причины возвратов по каналу.' : 'Следующий шаг: сравнить конверсию и возвраты по каналам.'; next.hidden = false; });
  </script>
</main></body></html>
