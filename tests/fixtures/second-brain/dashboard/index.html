<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Докрути — dashboard golden</title><style>
  :root{--chocolate:#17130F;--graphite:#262626;--paper:#F4F5F6;--trace:#D9562F;--blue:#2F80ED;--muted:#B8B0A6}*{box-sizing:border-box}body{margin:0;background:var(--chocolate);color:var(--paper);font:16px/1.5 system-ui,sans-serif}main{max-width:960px;margin:auto;padding:36px 22px}h1{font:500 clamp(40px,7vw,70px)/.95 Georgia,serif;letter-spacing:-.05em}.toolbar{display:flex;gap:12px;flex-wrap:wrap;margin:26px 0}.toolbar button{min-height:48px;background:var(--trace);border:0;color:var(--paper);padding:12px 18px;font-weight:700}.panel{padding:22px;background:var(--graphite);border:1px solid rgba(244,245,246,.2)}table{width:100%;border-collapse:collapse;margin-top:16px}th,td{text-align:left;padding:12px 8px;border-bottom:1px solid rgba(244,245,246,.15)}.status{color:var(--muted)}.decision{border-left:3px solid var(--trace);padding-left:14px;margin-top:20px}@media(max-width:600px){table{font-size:14px}.panel{overflow:auto}}
  </style></head><body><main><p>ДОКРУТИ / decision dashboard golden</p><h1>Один следующий приоритет.</h1><p id="freshness" class="status"></p><div class="toolbar"><button type="button" data-filter="all">Все каналы</button><button type="button" data-filter="Сайт">Сайт</button><button type="button" data-filter="Мессенджер">Мессенджер</button><button type="button" data-filter="Партнёры">Партнёры</button></div><section class="panel" id="dashboard" data-state="loading" aria-live="polite"><strong id="state">Загружаю данные</strong><table hidden><thead><tr><th>Канал</th><th>Конверсия</th><th>Возвраты</th></tr></thead><tbody id="rows"></tbody></table><p class="decision" id="decision" hidden></p></section><script>
    const data = [{channel:'Сайт',conversion:.031,returns:.08},{channel:'Мессенджер',conversion:.052,returns:.14},{channel:'Партнёры',conversion:.021,returns:.05}]; const panel=document.querySelector('#dashboard'); const state=document.querySelector('#state'); const table=panel.querySelector('table'); const rows=document.querySelector('#rows'); const decision=document.querySelector('#decision'); document.querySelector('#freshness').textContent=`Обновлено: ${new Date().toISOString()}`;
    function render(filter='all'){ panel.dataset.state='ready'; state.textContent='Данные готовы'; rows.replaceChildren(); const visible=data.filter(item=>filter==='all'||item.channel===filter); visible.forEach(item=>{const row=document.createElement('tr'); [item.channel,`${(item.conversion*100).toFixed(1)}%`,`${(item.returns*100).toFixed(1)}%`].forEach(value=>{const cell=document.createElement('td');cell.textContent=value;row.append(cell)});rows.append(row)}); table.hidden=false; decision.hidden=false; const priority=[...visible].sort((a,b)=>(b.returns-b.conversion)-(a.returns-a.conversion))[0]; decision.textContent=priority?`Следующий шаг: проверить возвраты в канале «${priority.channel}».`:'Нет данных для решения';} setTimeout(()=>render(),40); document.querySelectorAll('[data-filter]').forEach(button=>button.addEventListener('click',()=>render(button.dataset.filter)));
  </script></main></body></html>
