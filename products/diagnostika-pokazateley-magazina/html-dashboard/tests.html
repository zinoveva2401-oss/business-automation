<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Тесты — Диагностика показателей магазина</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .test-shell{width:min(1100px,calc(100% - 28px));margin:28px auto 50px}.test-summary{padding:24px;background:#173f70;color:#fff;border-radius:16px}.test-summary h1{font-family:Arial,sans-serif;font-size:32px}.test-list{display:grid;gap:14px;margin-top:20px}.test-case{padding:20px;background:#fff;border:1px solid #d7dee5;border-left:7px solid #a63f35;border-radius:12px}.test-case.pass{border-left-color:#3d765b}.test-case h2{font-size:19px}.test-case dl{display:grid;grid-template-columns:170px 1fr;gap:6px 12px;margin:14px 0 0}.test-case dt{font-weight:700;color:#66707b}.test-case dd{margin:0}.status{font-weight:800}.pass .status{color:#3d765b}@media(max-width:600px){.test-case dl{grid-template-columns:1fr}.test-case dd{margin-bottom:8px}}
  </style>
</head>
<body>
  <main class="test-shell">
    <header class="test-summary"><p class="step-label step-label--light">Автоматическая проверка</p><h1 id="summary">Выполняются 20 тестов…</h1><p>Расчёты запускаются локально, без сервера и сети.</p></header>
    <section class="test-list" id="test-list" aria-live="polite"></section>
  </main>
  <script src="app.js"></script>
  <script>
    'use strict';
    const E = window.DiagnosticEngine;
    const p = (revenue, checks, items, visitors, markup=50) => ({revenue, checks, items, visitors, markup});
    const diagnosis = (a,b) => E.analyze('compare',a,b).diagnosis;
    const d = (zone, fact, meaning, risk='') => ({zone, fact, meaning, risk});
    const trafficMeaning = 'Магазин получает недостаточно входящего потока.';
    const conversionMeaning = 'Посетители приходят, но реже совершают покупку.';
    const checkMeaning = 'Сумма одной покупки стала меньше.';
    const profitMeaning = 'Магазин продаёт, но зарабатывает меньше с этих продаж.';
    const stableMeaning = 'Система работает стабильно относительно первого периода.';
    const cases = [
      ['Трафик снизился, конверсия стабильна',d('Трафик','Посетителей стало меньше, при этом конверсия существенно не ухудшилась.',trafficMeaning,'Прибыльность'),()=>diagnosis(p(100000,100,200,500),p(80000,80,160,400))],
      ['Трафик стабилен, конверсия снизилась',d('Конверсия','Трафик сохранился или вырос, но покупок стало меньше.',conversionMeaning),()=>diagnosis(p(100000,100,200,500),p(90000,80,160,500,100))],
      ['Трафик вырос, конверсия снизилась',d('Конверсия','Трафик сохранился или вырос, но покупок стало меньше.',conversionMeaning),()=>diagnosis(p(100000,100,200,500),p(100000,90,180,600,100))],
      ['Трафик и конверсия снизились',d('Трафик','Трафик снизился сильнее конверсии.',trafficMeaning,'Конверсия'),()=>diagnosis(p(100000,100,200,500),p(90000,72,150,400))],
      ['Средний чек снизился из-за товаров в покупке',d('Средний чек','Средний чек снизился из-за меньшего количества товаров в покупке.',checkMeaning,'Прибыльность'),()=>diagnosis(p(100000,100,200,500),p(90000,100,150,500))],
      ['Средний чек снизился из-за средней цены товара',d('Средний чек','Средний чек снизился из-за уменьшения средней цены проданного товара.',checkMeaning,'Прибыльность'),()=>diagnosis(p(100000,100,200,500),p(80000,100,200,500))],
      ['Средний чек снизился из-за обоих факторов',d('Средний чек','Средний чек снизился одновременно из-за количества товаров и средней цены.',checkMeaning,'Прибыльность'),()=>diagnosis(p(100000,100,200,500),p(72000,100,160,500))],
      ['Выручка выросла, прибыль снизилась',d('Прибыльность','Выручка сохранилась или выросла, но ориентировочная валовая прибыль снизилась.',profitMeaning),()=>diagnosis(p(100000,100,200,500,100),p(105000,100,200,500,50))],
      ['Все четыре зоны снизились',d('Системное снижение','Одновременно ухудшились трафик, конверсия, средний чек и прибыльность.','Проблема не ограничивается одним показателем.'),()=>diagnosis(p(100000,100,200,500,100),p(50000,60,90,400,50))],
      ['Все зоны стабильны',d('Не выявлена','Ключевые показатели не ухудшились существенно.',stableMeaning),()=>diagnosis(p(100000,100,200,500),p(100000,100,200,500))],
      ['Все зоны выросли',d('Не выявлена','Ключевые показатели не ухудшились существенно.',stableMeaning),()=>diagnosis(p(100000,100,200,500),p(130000,120,260,550,60))],
      ['Изменения ровно 5% или внутри порога',d('Не выявлена','Ключевые показатели не ухудшились существенно.',stableMeaning),()=>diagnosis(p(100000,100,200,500),p(95000,95,190,475))],
      ['Нулевой показатель','Ошибка: больше нуля',()=>E.analyze('current',p(100000,0,200,500)).period1.errors.checks.includes('больше нуля')?'Ошибка: больше нуля':'Ошибка не найдена'],
      ['Отрицательное значение','Ошибка: отрицательное',()=>E.analyze('current',p(-1,100,200,500)).period1.errors.revenue.includes('отрицательным')?'Ошибка: отрицательное':'Ошибка не найдена'],
      ['Текст вместо числа','Ошибка: введите число',()=>E.analyze('current',p('текст',100,200,500)).period1.errors.revenue.includes('Введите число')?'Ошибка: введите число':'Ошибка не найдена'],
      ['Режим текущего состояния','Оценка без слабой зоны',()=>{const r=E.analyze('current',p(100000,100,200,500));return r.valid&&r.mode==='current'&&!r.diagnosis?'Оценка без слабой зоны':'Неверный вывод'}],
      ['Нулевая выручка первого периода','Для сравнения выручка первого периода должна быть больше нуля',()=>E.analyze('compare',p(0,100,200,500),p(100,100,200,500)).period1.errors.revenue],
      ['Десятичная запятая','125,5',()=>String(E.analyze('compare',p('100,5',100,200,500),p('125,5',100,200,'500,5')).secondData.revenue).replace('.',',')],
      ['Выручка и прибыль снизились одновременно',d('Прибыльность','Выручка снизилась, а ориентировочная валовая прибыль сократилась ещё сильнее.',profitMeaning,'Средний чек'),()=>diagnosis(p(100000,100,200,500,100),p(90000,100,200,500,50))],
      ['Корректность дополнительного риска','Конверсия',()=>diagnosis(p(100000,100,200,500),p(90000,72,150,400)).risk]
    ];
    let passed=0; const list=document.querySelector('#test-list');
    const display = value => typeof value === 'object' ? JSON.stringify(value) : value;
    cases.forEach(([name,expected,run],i)=>{let actual;try{actual=run()}catch(error){actual='Ошибка: '+error.message}const ok=display(actual)===display(expected);if(ok)passed++;list.insertAdjacentHTML('beforeend',`<article class="test-case ${ok?'pass':''}"><h2>${i+1}. ${name}</h2><dl><dt>Ожидаемый результат</dt><dd>${display(expected)}</dd><dt>Фактический результат</dt><dd>${display(actual)}</dd><dt>Статус</dt><dd class="status">${ok?'Пройден':'Не пройден'}</dd></dl></article>`)});
    document.querySelector('#summary').textContent=`Пройдено ${passed} из ${cases.length}`;
    document.documentElement.dataset.passed=String(passed);
  </script>
</body>
</html>
