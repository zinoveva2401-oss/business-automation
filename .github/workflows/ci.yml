name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - codex/dokruti-system-normalization-2026-10-08

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Core contract checks verify ancestry to a canonical SHA, which shallow clones cannot prove.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type and content check
        run: npm run check

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Core architecture and owner-boundary contracts
        run: npm run test:core-contract

      - name: Product and Site controlled release-gate regression
        run: npm run test:domain-release-gate

      - name: Product and Site changed-artifact release gates
        if: github.event_name == 'pull_request'
        env:
          GITHUB_BASE_REF: ${{ github.event.pull_request.base.ref }}
          DOKRUTI_STAGE_STATE_FILE: ${{ runner.temp }}/dokruti-stage-state.json
        run: node scripts/check-domain-release-packets.mjs

      - name: Runtime watchdog regression
        run: npm run test:runtime-watchdog

      - name: Build
        run: npm run build
